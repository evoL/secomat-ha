[project]
name = "secomat-ha"
version = "0.1.0"
description = "Home Assistant integration for the Krüger Secomat room-air laundry dryer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    # HA 2024's test harness predates pycares' background shutdown thread.
    "pycares<4.5; python_version < '3.13'",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF012", # Home Assistant Entity subclasses define mutable _attr_* class attributes by convention
]

[tool.ruff.lint.isort]
combine-as-imports = true
